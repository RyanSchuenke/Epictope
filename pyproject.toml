[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "epictope"
version = "0.0.1"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "Epitope tagging site prediction tool"
readme = "README.md"
requires-python = ">=3.9" # required version not determined
dependencies = ["pandas", "matplotlib", "requests", "pyyaml", "biopython"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0"
license-files = ["LICEN[CS]E*"]

[project.scripts]
epictope = "epictope.cli:main"

